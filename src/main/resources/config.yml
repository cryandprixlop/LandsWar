# ===== LandsEdit =====
# Все цены — в валюте сервера (Vault).

territory:
  chunk-price: 5000.0        # цена доп. чанка (админ может править на территорию)
  max-chunks: 3              # лимит чанков территории (донат-расширение — v2)
  residents-per-chunk: 2     # лимит жителей (старейшины + жители) на чанк

tax:
  per-day-base: 100.0        # налог в день за территорию
  per-chunk-per-day: 50.0    # доплата в день за каждый чанк сверх первого
  max-prepaid-days: 20       # потолок предоплаты СУММАРНО
  freeze-days: 3             # дней заморозки после просрочки, затем аукцион
  remind-on-join-days: 3     # напоминание при входе, если осталось <= N дней

auction:
  duration-hours: 24         # длительность торгов
  min-step-percent: 5.0      # мин. шаг ставки от текущей
  proceeds-to-previous-owner: false   # false = выручка сгорает

war:
  declare-cost: 10000.0      # цена объявления войны
  cooldown-hours: 72         # кулдаун после войны у обеих сторон
  notice-hours: 24           # от объявления до старта активной фазы
  active-hours: 1            # длительность активной фазы
  capture-seconds: 600       # суммарно секунд у знамени для захвата (10 мин)
  banner-radius: 5.0         # радиус засчитывания у знамени
  reward-window-hours: 24    # окно выбора награды победителем
  loot-minutes: 60           # доступ к сундукам после выбора loot
  afk-offline-hours: 24      # порог оффлайна защитника (АФК)
  afk-postpone-hours: 6      # отсрочка старта после входа АФК-владельца

ally:
  break-cooldown-hours: 24   # кулдаун разрыва союза

protection:
  allow-explosions: false
  allow-fire: false
  allow-mob-grief: false
  allow-liquid-flow-in: false
  allow-use-outsiders: true  # двери/рычаги посторонним
  pvp-only-war: true         # PvP внутри территории только между воюющими

